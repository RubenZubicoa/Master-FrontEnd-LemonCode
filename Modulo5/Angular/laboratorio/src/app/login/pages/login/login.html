<div class="login-container">
    <div class="form-container">
        <h1>Iniciar sesión</h1>
        <mat-form-field>
            <mat-label>Usuario</mat-label>
            <input matInput type="text" placeholder="Introduce el usuario" [formControl]="usernameFormControl" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" placeholder="Introduce la contraseña" [formControl]="passwordFormControl" />
        </mat-form-field>
        <button mat-raised-button (click)="login()">Login</button>
    </div>
</div>
